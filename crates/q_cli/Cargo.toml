[package]
name = "q_cli"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
publish.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
camino = { workspace = true }
cfg-if = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
color-print = { workspace = true }
console = { workspace = true }
crossterm = { workspace = true, optional = true }
dirs = { workspace = true }
eyre = { workspace = true }
fig_os_shim = { path = "../fig_os_shim" }
fig_proto = { path = "../fig_proto" }
fig_util = { path = "../fig_util" }
futures = { workspace = true }
http = { workspace = true }
indicatif = { workspace = true }
itertools = { workspace = true }
lazy_static = { workspace = true }
mcp_client = { path = "../mcp_client" }
once_cell = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
skim = { workspace = true, optional = true }
strum = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
tuikit = { workspace = true, optional = true }
url = { workspace = true }
uuid = { workspace = true }
which = { workspace = true }

[features]
default = ["auto-terminal"]
auto-terminal = ["unix-terminal", "windows-terminal"]
unix-terminal = ["skim", "tuikit"]
windows-terminal = ["crossterm"]
minimal = []  # No terminal UI

[lints]
workspace = true

[dev-dependencies]
assert_cmd = { workspace = true }
insta = { workspace = true }
predicates = { workspace = true }
rstest = { workspace = true }
serial_test = { workspace = true }
test-case = { workspace = true }
test-context = { workspace = true }
